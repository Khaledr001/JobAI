name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "24.11.1"
  PNPM_VERSION: "11.2.2"
  # Forced everywhere in CI: a test that tries a live LLM call fails on a
  # missing key rather than spending money in a pull request from anywhere.
  LLM_MODE: replay

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm check:privacy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm verify:no-fabrication
      - run: pnpm verify:validator
      - run: pnpm build
      - run: pnpm format:check

  invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jobhunter_migrator
          POSTGRES_PASSWORD: migrator_dev_password
          POSTGRES_DB: jobhunter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhunter_migrator -d jobhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://jobhunter_app:app_dev_password@localhost:5432/jobhunter
      DATABASE_URL_MIGRATOR: postgres://jobhunter_migrator:migrator_dev_password@localhost:5432/jobhunter
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm verify:claims-integrity
